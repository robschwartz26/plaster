<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Plaster Clipper — Options</title>
<style>
  body { max-width: 560px; margin: 40px auto; padding: 0 20px; background: #0c0b0b; color: #f0ece3; font: 14px "Space Grotesk", system-ui, sans-serif; }
  h1 { font: 900 26px Georgia, serif; }
  label { display: block; margin: 18px 0 6px; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(240,236,227,0.55); }
  input { width: 100%; box-sizing: border-box; padding: 11px 13px; border-radius: 10px; border: 1px solid rgba(240,236,227,0.2); background: rgba(240,236,227,0.06); color: #f0ece3; font: 13px monospace; }
  button { margin-top: 18px; padding: 11px 22px; border: none; border-radius: 10px; background: #A855F7; color: #fff; font: 700 14px "Space Grotesk", system-ui, sans-serif; cursor: pointer; }
  #msg { margin-left: 12px; color: #4ade80; }
  p.help { color: rgba(240,236,227,0.5); font-size: 12.5px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>plaster clipper</h1>
  <label for="token">Clipper token</label>
  <input id="token" type="password" placeholder="paste the CLIPPER_TOKEN value">
  <p class="help">This token only works for clipper captures — it can't read or touch anything else. It lives only in this browser's local extension storage.</p>
  <label for="endpoint">Endpoint</label>
  <input id="endpoint" type="text" placeholder="https://…functions/v1/firecrawl-ingest">
  <button id="save">Save</button><span id="msg"></span>
  <script src="options.js"></script>
</body>
</html>
