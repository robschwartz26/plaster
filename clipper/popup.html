<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 290px; margin: 0; padding: 14px; background: #0c0b0b; color: #f0ece3; font: 13px "Space Grotesk", system-ui, sans-serif; }
  h1 { font: 900 20px Georgia, serif; margin: 0 0 10px; }
  button { display: block; width: 100%; margin-bottom: 8px; padding: 10px 12px; border: none; border-radius: 10px; background: #A855F7; color: #fff; font: 700 13px "Space Grotesk", system-ui, sans-serif; cursor: pointer; text-align: left; }
  button.secondary { background: rgba(240,236,227,0.08); color: #f0ece3; border: 1px solid rgba(240,236,227,0.18); font-weight: 600; }
  .kbd { float: right; opacity: 0.7; font-weight: 600; }
  #log { margin-top: 10px; max-height: 180px; overflow-y: auto; border-top: 1px solid rgba(240,236,227,0.12); padding-top: 8px; }
  .row { padding: 4px 0; border-bottom: 1px solid rgba(240,236,227,0.06); line-height: 1.35; }
  .s-saved { color: #4ade80; } .s-duplicate { color: #fbbf24; } .s-orphaned { color: #c084fc; } .s-error { color: #f87171; }
  .meta { color: rgba(240,236,227,0.45); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a { color: #A855F7; }
  .foot { margin-top: 8px; font-size: 11px; color: rgba(240,236,227,0.4); }
</style>
</head>
<body>
  <h1>plaster clipper</h1>
  <button id="region">Region grab <span class="kbd">⌘⇧S</span></button>
  <button id="window">Whole page grab <span class="kbd">⌘⇧D</span></button>
  <button id="sweep" class="secondary">Sweep all tabs (grabs each one)</button>
  <div id="log"></div>
  <div class="foot"><a href="#" id="opts">Options</a> · everything lands in the Review queue</div>
  <script src="popup.js"></script>
</body>
</html>
