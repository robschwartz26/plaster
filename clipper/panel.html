<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 14px; background: #0c0b0b; color: #f0ece3; font: 13px "Space Grotesk", system-ui, sans-serif; }
  .top { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; }
  h1 { font: 900 22px Georgia, serif; margin: 0; }
  #info-btn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(240,236,227,0.25); background: none; color: rgba(240,236,227,0.6); font: 700 13px Georgia, serif; cursor: pointer; }
  #cheat { display: none; margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: rgba(240,236,227,0.05); border: 1px solid rgba(240,236,227,0.12); font-size: 12px; line-height: 1.7; }
  #cheat.open { display: block; }
  #cheat b { color: #c084fc; font-family: monospace; }
  #venue-row { display: flex; gap: 6px; margin: 0 0 10px; }
  #venue-lock { flex-shrink: 0; width: 38px; border-radius: 10px; border: 1px solid rgba(240,236,227,0.2); background: rgba(240,236,227,0.06); font-size: 15px; cursor: pointer; }
  #venue-lock.locked { background: #A855F7; border-color: #A855F7; }
  #venue-lock:disabled { opacity: 0.35; cursor: default; }
  #venue { flex: 1; min-width: 0; margin: 0; padding: 9px 11px; border-radius: 10px; border: 1px solid rgba(240,236,227,0.2); background: rgba(240,236,227,0.06); color: #f0ece3; font: 600 13px "Space Grotesk", system-ui, sans-serif; }
  #venue.set { border-color: rgba(168,85,247,0.6); background: rgba(168,85,247,0.1); color: #c084fc; }
  button.act { display: block; width: 100%; margin-bottom: 8px; padding: 9px 12px; border-radius: 10px; background: rgba(240,236,227,0.08); color: #f0ece3; border: 1px solid rgba(240,236,227,0.18); font: 600 12.5px "Space Grotesk", system-ui, sans-serif; cursor: pointer; text-align: left; }
  .kbd { float: right; opacity: 0.7; font-weight: 600; }
  #feed { margin-top: 12px; border-top: 1px solid rgba(240,236,227,0.12); }
  .card { padding: 10px 0; border-bottom: 1px solid rgba(240,236,227,0.08); }
  .card .head { display: flex; gap: 10px; cursor: pointer; position: relative; padding-right: 22px; }
  .card img.thumb { width: 54px; height: 76px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: rgba(240,236,227,0.06); }
  .noimg { width: 54px; height: 76px; border-radius: 6px; flex-shrink: 0; background: rgba(240,236,227,0.06); }
  .body { flex: 1; min-width: 0; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .p-saved { background: rgba(74,222,128,0.15); color: #4ade80; }
  .p-working { background: rgba(240,236,227,0.1); color: rgba(240,236,227,0.6); }
  .p-duplicate { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .p-orphaned { background: rgba(192,132,252,0.16); color: #c084fc; }
  .p-error { background: rgba(248,113,113,0.14); color: #f87171; }
  .p-erased { background: rgba(240,236,227,0.08); color: rgba(240,236,227,0.4); }
  .p-confirm { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .p-confirm-venue { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .name { font-weight: 700; margin: 4px 0 2px; line-height: 1.3; }
  .meta { color: rgba(240,236,227,0.45); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason { color: rgba(240,236,227,0.6); font-size: 11.5px; margin-top: 2px; line-height: 1.35; }
  .dismiss { position: absolute; top: 0; right: 0; width: 20px; height: 20px; border: none; border-radius: 50%; background: rgba(240,236,227,0.08); color: rgba(240,236,227,0.5); font-size: 12px; line-height: 1; cursor: pointer; }
  .detail { display: none; margin-top: 8px; padding: 9px 11px; border-radius: 8px; background: rgba(240,236,227,0.04); border: 1px solid rgba(240,236,227,0.1); font-size: 12px; line-height: 1.55; }
  .card.open .detail { display: block; }
  .detail .field { color: rgba(240,236,227,0.45); font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin: 7px 0 1px; }
  .detail .field:first-child { margin-top: 0; }
  .btnrow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .mini { padding: 5px 12px; border-radius: 8px; font: 600 11px "Space Grotesk", system-ui, sans-serif; cursor: pointer; }
  .mini.go { border: none; background: #A855F7; color: #fff; }
  .mini.warn { border: 1px solid rgba(248,113,113,0.4); background: none; color: #f87171; }
  .foot { margin-top: 10px; font-size: 11px; color: rgba(240,236,227,0.4); line-height: 1.6; }
  a { color: #A855F7; text-decoration: none; }
  .empty { padding: 22px 0; color: rgba(240,236,227,0.35); text-align: center; }
  #staged .slot { display: flex; gap: 10px; align-items: center; padding: 10px; margin-bottom: 10px; border: 1.5px dashed rgba(168,85,247,0.55); border-radius: 12px; background: rgba(168,85,247,0.07); }
  #staged img { width: 54px; height: 76px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  #staged .t { flex: 1; min-width: 0; }
  #staged .label { font-weight: 700; color: #c084fc; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; }
  #staged .hint { color: rgba(240,236,227,0.55); font-size: 11.5px; margin-top: 3px; line-height: 1.4; }
  #staged .reject { margin-top: 6px; padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(248,113,113,0.4); background: none; color: #f87171; font: 600 11px "Space Grotesk", system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <div class="top">
    <h1>plaster clipper</h1>
    <button id="info-btn" title="Hotkeys">i</button>
  </div>
  <div id="cheat">
    <b>⌥-click</b> / double-click an image → stage as poster<br>
    <b>⌘⇧P</b> stage a custom poster region<br>
    <b>⌘⇧S</b> grab the info region → ingest<br>
    <b>⌘⇧Z</b> grab the whole page → ingest
  </div>
  <div id="venue-row">
    <select id="venue" title="Venue for these captures — a venue named in the capture still wins (unless locked)">
      <option value="">venue: auto-detect from capture</option>
    </select>
    <button id="venue-lock" title="Lock: EVERY capture files under this venue — no guessing, and the AI is told the venue for the blurb">🔓</button>
  </div>
  <div id="staged"></div>
  <button class="act" id="poster">Stage poster (custom region) <span class="kbd">⌘⇧P</span></button>
  <div id="feed"><div class="empty">Captures show up here</div></div>
  <div class="foot">
    Saved events wait in <a href="https://plasterthewall.com/staff" target="_blank">Staff → Review</a> ·
    <a href="#" id="sweep">Sweep tabs</a> · <a href="#" id="opts">Options</a> · <a href="#" id="clear">Clear list</a>
  </div>
  <script src="panel.js"></script>
</body>
</html>
