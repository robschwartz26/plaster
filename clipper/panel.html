<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 14px; background: #0c0b0b; color: #f0ece3; font: 13px "Space Grotesk", system-ui, sans-serif; }
  h1 { font: 900 22px Georgia, serif; margin: 0 0 12px; }
  button.act { display: block; width: 100%; margin-bottom: 8px; padding: 11px 12px; border: none; border-radius: 10px; background: #A855F7; color: #fff; font: 700 13px "Space Grotesk", system-ui, sans-serif; cursor: pointer; text-align: left; }
  button.act.secondary { background: rgba(240,236,227,0.08); color: #f0ece3; border: 1px solid rgba(240,236,227,0.18); font-weight: 600; }
  .kbd { float: right; opacity: 0.7; font-weight: 600; }
  #feed { margin-top: 14px; border-top: 1px solid rgba(240,236,227,0.12); }
  .card { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(240,236,227,0.08); }
  .card img { width: 54px; height: 76px; object-fit: cover; border-radius: 6px; flex-shrink: 0; background: rgba(240,236,227,0.06); }
  .noimg { width: 54px; height: 76px; border-radius: 6px; flex-shrink: 0; background: rgba(240,236,227,0.06); }
  .body { flex: 1; min-width: 0; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .p-saved { background: rgba(74,222,128,0.15); color: #4ade80; }
  .p-working { background: rgba(240,236,227,0.1); color: rgba(240,236,227,0.6); }
  .p-duplicate { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .p-orphaned { background: rgba(192,132,252,0.16); color: #c084fc; }
  .p-error { background: rgba(248,113,113,0.14); color: #f87171; }
  .p-erased { background: rgba(240,236,227,0.08); color: rgba(240,236,227,0.4); }
  .name { font-weight: 700; margin: 4px 0 2px; line-height: 1.3; }
  .meta { color: rgba(240,236,227,0.45); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason { color: rgba(240,236,227,0.6); font-size: 11.5px; margin-top: 2px; line-height: 1.35; }
  .erase { margin-top: 6px; padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(248,113,113,0.4); background: none; color: #f87171; font: 600 11px "Space Grotesk", system-ui, sans-serif; cursor: pointer; }
  .foot { margin-top: 10px; font-size: 11px; color: rgba(240,236,227,0.4); line-height: 1.5; }
  a { color: #A855F7; text-decoration: none; }
  .empty { padding: 22px 0; color: rgba(240,236,227,0.35); text-align: center; }
  #staged .slot { display: flex; gap: 10px; align-items: center; padding: 10px; margin-bottom: 10px; border: 1.5px dashed rgba(168,85,247,0.55); border-radius: 12px; background: rgba(168,85,247,0.07); }
  #staged img { width: 54px; height: 76px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  #staged .t { flex: 1; min-width: 0; }
  #staged .label { font-weight: 700; color: #c084fc; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; }
  #staged .hint { color: rgba(240,236,227,0.55); font-size: 11.5px; margin-top: 3px; line-height: 1.4; }
  #staged .reject { margin-top: 6px; padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(248,113,113,0.4); background: none; color: #f87171; font: 600 11px "Space Grotesk", system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <h1>plaster clipper</h1>
  <div id="staged"></div>
  <div class="foot" style="margin:0 0 8px">⌥-click or double-click any image on a page to stage it as the poster</div>
  <button class="act secondary" id="poster">Stage poster (custom region) <span class="kbd">⌘⇧P</span></button>
  <button class="act" id="region">Grab the info → ingest <span class="kbd">⌘⇧S</span></button>
  <button class="act" id="window">Whole page grab <span class="kbd">⌘⇧K</span></button>
  <button class="act secondary" id="sweep">Sweep all tabs (grabs each one)</button>
  <div id="feed"><div class="empty">Captures show up here</div></div>
  <div class="foot">
    Saved events wait in <a href="https://plasterthewall.com/staff" target="_blank">Staff → Review</a> for your approval ·
    <a href="#" id="opts">Options</a> · <a href="#" id="clear">Clear list</a>
  </div>
  <script src="panel.js"></script>
</body>
</html>
